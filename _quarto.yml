project:
  type: website
  output-dir: _site
  # Open-licensed reading excerpts (PML/UDL) served alongside the site;
  # linked from schedule.qmd's Readings column.
  resources:
    - readings

website:
  title: "INFO 521 — Machine Learning Foundations"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: syllabus.qmd
        text: Syllabus
      - href: schedule.qmd
        text: Schedule
      - href: slides.qmd
        text: Slides
      - href: activities.qmd
        text: Activities
      - href: discussions.qmd
        text: Discussions
      - href: projects.qmd
        text: Projects
      - href: homeworks.qmd
        text: Homeworks
      - href: assessment.qmd
        text: Assessment
    right:
      - text: "GitHub"
        icon: github
        aria-label: "GitHub repositories"
        menu:
          - href: "{{< var hub_repo_url >}}"
            text: "Hub (this site)"
          - href: "{{< var slides_repo_url >}}"
            text: "Slides"
          - href: "{{< var activities_repo_url >}}"
            text: "Activities"
          - href: "{{< var projects_repo_url >}}"
            text: "Projects"
  page-footer:
    left: |
      © 2026 University of Arizona College of Information Science
    right: |
      Built with [Quarto](https://quarto.org/)

format:
  html:
    theme: [cosmo, theme.scss]
    toc: true
    page-footer:
      left: |
        © 2026 University of Arizona College of Information Science
